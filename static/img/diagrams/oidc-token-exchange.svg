<!-- static/img/diagrams/oidc-token-exchange.svg — Course diagram system v1
     canvas #1a1a19 · Azure #3987e5 · OpenTofu #c98500 · developer #199e70 · GitHub neutral
     ink #fff / #c3c2b7 / #898781 · palette CVD-validated (dataviz validator, dark surface) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="oidcTitle oidcDesc">
  <title id="oidcTitle">OIDC token exchange, step by step</title>
  <desc id="oidcDesc">Sequence diagram: the workflow job requests an ID token from GitHub's OIDC provider, receives a signed JWT, exchanges it at the Microsoft Entra ID token endpoint where the federated credential is checked, receives a short-lived access token, and then makes authenticated Azure Resource Manager calls.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="647" rx="12" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="32" y="46" font-size="20" font-weight="600" fill="#ffffff">OIDC token exchange, step by step</text>
  <text x="32" y="70" font-size="13" fill="#898781">How a workflow job proves its identity to Azure without a single stored secret</text>

  <!-- Lifeline headers -->
  <rect x="40" y="100" width="200" height="52" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c3c2b7" stroke-width="1.25"/>
  <text x="140" y="122" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Workflow job</text>
  <text x="140" y="140" font-size="11" fill="#898781" text-anchor="middle">on a GitHub-hosted runner</text>

  <rect x="290" y="100" width="200" height="52" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c3c2b7" stroke-width="1.25"/>
  <text x="390" y="122" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">GitHub OIDC provider</text>
  <text x="390" y="140" font-size="11" fill="#898781" text-anchor="middle">GitHub's token issuer</text>

  <rect x="540" y="100" width="200" height="52" rx="10" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-width="1.25"/>
  <text x="640" y="122" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Microsoft Entra ID</text>
  <text x="640" y="140" font-size="11" fill="#898781" text-anchor="middle">federated credential check</text>

  <rect x="770" y="100" width="176" height="52" rx="10" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-width="1.25"/>
  <text x="858" y="122" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Azure Resource</text>
  <text x="858" y="140" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Manager</text>

  <!-- Lifelines -->
  <line x1="140" y1="156" x2="140" y2="600" stroke="#383835" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="390" y1="156" x2="390" y2="600" stroke="#383835" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="640" y1="156" x2="640" y2="600" stroke="#383835" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="858" y1="156" x2="858" y2="600" stroke="#383835" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 1: request token -->
  <line x1="140" y1="196" x2="384" y2="196" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="184" font-size="12.5" fill="#c3c2b7" text-anchor="middle">1 · request an ID token</text>
  <text x="265" y="214" font-size="11" fill="#898781" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">needs permissions: id-token: write</text>

  <!-- 2: signed JWT -->
  <line x1="390" y1="252" x2="146" y2="252" stroke="#898781" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="265" y="240" font-size="12.5" fill="#c3c2b7" text-anchor="middle">2 · signed JWT with claims</text>
  <text x="265" y="270" font-size="11" fill="#898781" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">sub = repo:ORG/REPO:environment:prod</text>

  <!-- 3: exchange at Entra -->
  <line x1="140" y1="320" x2="634" y2="320" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="308" font-size="12.5" fill="#c3c2b7" text-anchor="middle">3 · exchange the JWT at the Entra token endpoint</text>
  <text x="390" y="338" font-size="11" fill="#898781" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">client-id + tenant-id identify the app</text>

  <!-- Entra validation note -->
  <rect x="548" y="358" width="184" height="72" rx="8" fill="#3987e5" fill-opacity="0.10" stroke="#3987e5" stroke-opacity="0.6" stroke-dasharray="4 3"/>
  <text x="640" y="382" font-size="11.5" fill="#c3c2b7" text-anchor="middle">checks issuer, subject and</text>
  <text x="640" y="398" font-size="11.5" fill="#c3c2b7" text-anchor="middle">audience against the</text>
  <text x="640" y="414" font-size="11.5" fill="#c3c2b7" text-anchor="middle">federated credential</text>

  <!-- 4: access token -->
  <line x1="640" y1="470" x2="146" y2="470" stroke="#898781" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="390" y="458" font-size="12.5" fill="#c3c2b7" text-anchor="middle">4 · short-lived access token (roughly one hour)</text>

  <!-- 5: ARM calls -->
  <line x1="140" y1="530" x2="852" y2="530" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="499" y="518" font-size="12.5" fill="#c3c2b7" text-anchor="middle">5 · tofu plan / apply — authenticated Azure Resource Manager calls</text>

  <!-- bottom note -->
  <g transform="translate(52,614)">
    <circle r="8" fill="#0ca30c"/>
    <path d="M-3.5 0.5 L-1 3 L3.5 -2.5" fill="none" stroke="#1a1a19" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="68" y="610" font-size="12.5" fill="#c3c2b7">Nothing here can leak: the JWT is minted fresh for each job run, the access token expires,</text>
  <text x="68" y="628" font-size="12.5" fill="#c3c2b7">and Entra only trusts the exact repository and environment named in the federated credential.</text>
</svg>
