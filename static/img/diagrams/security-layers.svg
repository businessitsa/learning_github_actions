<!-- static/img/diagrams/security-layers.svg — Course diagram system v1
     canvas #1a1a19 · Azure #3987e5 · OpenTofu #c98500 · developer #199e70 · GitHub neutral
     ink #fff / #c3c2b7 / #898781 · palette CVD-validated (dataviz validator, dark surface) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="secTitle secDesc">
  <title id="secTitle">Defense in depth for the pipeline</title>
  <desc id="secDesc">Concentric layers protect the Azure production environment: branch protection and review, CI checks on every pull request, workflow hardening with pinned actions and a least-privilege token, OIDC identity with approval gates, and Azure RBAC scoped to two resource groups.</desc>

  <rect x="0.5" y="0.5" width="959" height="579" rx="12" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="32" y="46" font-size="20" font-weight="600" fill="#ffffff">Defense in depth: every change crosses every layer</text>
  <text x="32" y="70" font-size="13" fill="#898781">No single control is trusted alone — each layer assumes the one outside it can fail</text>

  <rect x="36" y="88" width="888" height="440" rx="14" fill="#ffffff" fill-opacity="0.02" stroke="#383835" stroke-width="1.25"/>
  <text x="56" y="114" font-size="13.5"><tspan fill="#ffffff" font-weight="600">1 · Branch protection and review</tspan><tspan fill="#898781" font-size="12" dx="10">no direct pushes to main — humans approve every change</tspan></text>

  <rect x="92" y="124" width="776" height="368" rx="14" fill="#ffffff" fill-opacity="0.02" stroke="#383835" stroke-width="1.25"/>
  <text x="112" y="150" font-size="13.5"><tspan fill="#ffffff" font-weight="600">2 · CI checks on every PR</tspan><tspan fill="#898781" font-size="12" dx="10">fmt · validate · tflint · trivy — problems die before merge</tspan></text>

  <rect x="148" y="160" width="664" height="296" rx="14" fill="#ffffff" fill-opacity="0.02" stroke="#383835" stroke-width="1.25"/>
  <text x="168" y="186" font-size="13.5"><tspan fill="#ffffff" font-weight="600">3 · Workflow hardening</tspan><tspan fill="#898781" font-size="12" dx="10">SHA-pinned actions · least-privilege GITHUB_TOKEN</tspan></text>

  <rect x="204" y="196" width="552" height="224" rx="14" fill="#ffffff" fill-opacity="0.02" stroke="#383835" stroke-width="1.25"/>
  <text x="224" y="222" font-size="13.5"><tspan fill="#ffffff" font-weight="600">4 · Identity</tspan><tspan fill="#898781" font-size="12" dx="10">OIDC short-lived tokens · environment approval gates</tspan></text>

  <rect x="260" y="232" width="440" height="152" rx="14" fill="#ffffff" fill-opacity="0.02" stroke="#383835" stroke-width="1.25"/>
  <text x="280" y="258" font-size="13.5"><tspan fill="#ffffff" font-weight="600">5 · Azure RBAC</tspan><tspan fill="#898781" font-size="12" dx="10">principal scoped to two resource groups</tspan></text>

  <rect x="316" y="276" width="328" height="76" rx="12" fill="#3987e5" fill-opacity="0.14" stroke="#3987e5" stroke-width="1.5"/>
  <text x="480" y="308" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Azure production environment</text>
  <text x="480" y="330" font-size="11.5" fill="#c3c2b7" text-anchor="middle">the thing every layer protects</text>

  <circle cx="52" cy="554" r="3" fill="#898781"/>
  <text x="66" y="558" font-size="12.5" fill="#c3c2b7">And afterwards: a scheduled drift-detection run re-plans on a timer, so changes made outside the pipeline surface as a diff.</text>
</svg>
