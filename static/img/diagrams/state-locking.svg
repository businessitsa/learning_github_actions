<!-- static/img/diagrams/state-locking.svg — Course diagram system v1
     canvas #1a1a19 · Azure #3987e5 · OpenTofu #c98500 · developer #199e70 · GitHub neutral
     ink #fff / #c3c2b7 / #898781 · palette CVD-validated (dataviz validator, dark surface) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lockTitle lockDesc">
  <title id="lockTitle">State locking with Azure blob leases</title>
  <desc id="lockDesc">Two concurrent OpenTofu runs target the same state blob in an Azure Storage container. Run A acquires the blob lease and proceeds. Run B finds the lease unavailable and waits or fails with a lock error, so state is never written by two processes at once.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="459" rx="12" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="32" y="46" font-size="20" font-weight="600" fill="#ffffff">State locking with Azure blob leases</text>
  <text x="32" y="70" font-size="13" fill="#898781">Two concurrent runs can't both write state — the second one has to wait</text>

  <!-- Runner A -->
  <rect x="36" y="140" width="200" height="80" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="136" y="172" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Run A</text>
  <text x="136" y="194" font-size="12" fill="#898781" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">tofu apply</text>

  <line x1="240" y1="180" x2="354" y2="180" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="168" font-size="12" fill="#c3c2b7" text-anchor="middle">1 · acquires lease</text>

  <!-- Runner B -->
  <rect x="36" y="280" width="200" height="80" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="136" y="312" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Run B</text>
  <text x="136" y="334" font-size="12" fill="#898781" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">tofu apply</text>

  <line x1="240" y1="320" x2="354" y2="320" stroke="#898781" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="298" y="308" font-size="12" fill="#c3c2b7" text-anchor="middle">2 · lease unavailable</text>
  <g transform="translate(252,344)">
    <path d="M0 -8 L8 6 L-8 6 Z" fill="#fab219"/>
    <rect x="-1" y="-3" width="2" height="5" fill="#1a1a19"/>
    <rect x="-1" y="3.4" width="2" height="1.8" fill="#1a1a19"/>
  </g>
  <text x="266" y="348" font-size="11.5" fill="#c3c2b7">waits, retries, or fails with a lock error</text>

  <!-- Storage account -->
  <rect x="360" y="120" width="280" height="220" rx="10" fill="#3987e5" fill-opacity="0.08" stroke="#3987e5" stroke-width="1.5"/>
  <text x="500" y="148" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Azure Storage account</text>
  <rect x="384" y="168" width="232" height="160" rx="8" fill="#3987e5" fill-opacity="0.08" stroke="#3987e5" stroke-opacity="0.6"/>
  <text x="500" y="192" font-size="12.5" fill="#c3c2b7" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">container: tfstate</text>
  <rect x="404" y="208" width="192" height="96" rx="8" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-opacity="0.8"/>
  <text x="500" y="236" font-size="13" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">prod.tfstate</text>
  <rect x="420" y="252" width="160" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#c3c2b7" stroke-opacity="0.6"/>
  <g transform="translate(438,269)">
    <rect x="-5" y="-2" width="10" height="8" rx="1.5" fill="#c3c2b7"/>
    <path d="M-3 -2 V-5 A3 3 0 0 1 3 -5 V-2" fill="none" stroke="#c3c2b7" stroke-width="1.8"/>
  </g>
  <text x="452" y="273" font-size="11.5" fill="#ffffff">lease held by Run A</text>

  <!-- auth note -->
  <rect x="680" y="150" width="244" height="118" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#383835"/>
  <g transform="translate(702,178)">
    <circle r="8" fill="#0ca30c"/>
    <path d="M-3.5 0.5 L-1 3 L3.5 -2.5" fill="none" stroke="#1a1a19" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="718" y="182" font-size="12.5" font-weight="600" fill="#ffffff">Backend auth: Entra ID</text>
  <text x="702" y="212" font-size="11.5" fill="#c3c2b7" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">use_azuread_auth = true</text>
  <text x="702" y="236" font-size="11.5" fill="#c3c2b7">role: Storage Blob Data Contributor</text>
  <text x="702" y="256" font-size="11.5" fill="#c3c2b7">shared key access: disabled</text>

  <!-- bottom note -->
  <g transform="translate(52,424)">
    <circle r="8" fill="#0ca30c"/>
    <path d="M-3.5 0.5 L-1 3 L3.5 -2.5" fill="none" stroke="#1a1a19" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="68" y="428" font-size="12.5" fill="#c3c2b7">Locking is automatic — OpenTofu takes a blob lease before any operation that writes state, and releases it afterwards.</text>
</svg>
