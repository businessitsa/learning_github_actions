<!-- static/img/diagrams/pr-plan-merge-apply.svg — Course diagram system v1
     canvas #1a1a19 · Azure #3987e5 · OpenTofu #c98500 · developer #199e70 · GitHub neutral
     ink #fff / #c3c2b7 / #898781 · palette CVD-validated (dataviz validator, dark surface) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="prTitle prDesc">
  <title id="prTitle">Plan on pull request, apply on merge</title>
  <desc id="prDesc">On a pull request the plan job runs read-only and posts the diff as a comment for review. After approval and merge to main, the apply job waits for the environment's required reviewer, then applies the plan to Azure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="599" rx="12" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="32" y="46" font-size="20" font-weight="600" fill="#ffffff">Plan on pull request, apply on merge</text>
  <text x="32" y="70" font-size="13" fill="#898781">The pipeline's two-phase heartbeat: propose and preview, then approve and execute</text>

  <!-- Lane 1: pull request -->
  <rect x="36" y="100" width="888" height="180" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#2c2c2a"/>
  <text x="56" y="128" font-size="12" fill="#898781" letter-spacing="1.5" font-weight="600">PULL REQUEST</text>

  <rect x="60" y="150" width="170" height="80" rx="10" fill="#199e70" fill-opacity="0.12" stroke="#199e70" stroke-width="1.5"/>
  <text x="145" y="182" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Open / update PR</text>
  <text x="145" y="204" font-size="12" fill="#c3c2b7" text-anchor="middle">.tf changes proposed</text>

  <line x1="234" y1="190" x2="282" y2="190" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="286" y="150" width="180" height="80" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="376" y="180" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Job: plan</text>
  <text x="376" y="202" font-size="11.5" fill="#898781" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">tofu plan (read-only)</text>

  <line x1="470" y1="190" x2="518" y2="190" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="522" y="150" width="190" height="80" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="617" y="180" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Plan → PR comment</text>
  <text x="617" y="202" font-size="12" fill="#c3c2b7" text-anchor="middle">reviewers see the diff</text>

  <line x1="716" y1="190" x2="764" y2="190" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="768" y="150" width="156" height="80" rx="10" fill="#199e70" fill-opacity="0.12" stroke="#199e70" stroke-width="1.5"/>
  <text x="846" y="182" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Review + approve</text>
  <text x="846" y="204" font-size="12" fill="#c3c2b7" text-anchor="middle">humans check the diff</text>

  <!-- merge elbow -->
  <path d="M846 234 V294 H138 V304" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="286" font-size="12.5" fill="#c3c2b7" text-anchor="middle">merge to main</text>

  <!-- Lane 2: main branch -->
  <rect x="36" y="310" width="888" height="230" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#2c2c2a"/>
  <text x="56" y="338" font-size="12" fill="#898781" letter-spacing="1.5" font-weight="600">MAIN BRANCH</text>

  <rect x="60" y="360" width="170" height="90" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="145" y="394" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Push lands on main</text>
  <text x="145" y="416" font-size="12" fill="#c3c2b7" text-anchor="middle">apply workflow starts</text>

  <line x1="234" y1="405" x2="282" y2="405" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="286" y="360" width="220" height="90" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#898781" stroke-width="1.5"/>
  <text x="396" y="390" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Environment: prod</text>
  <g transform="translate(318,412)">
    <path d="M0 -8 L8 6 L-8 6 Z" fill="#fab219"/>
    <rect x="-1" y="-3" width="2" height="5" fill="#1a1a19"/>
    <rect x="-1" y="3.4" width="2" height="1.8" fill="#1a1a19"/>
  </g>
  <text x="334" y="416" font-size="11.5" fill="#c3c2b7">waits for required reviewer</text>

  <line x1="510" y1="405" x2="558" y2="405" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="562" y="360" width="170" height="90" rx="10" fill="#c98500" fill-opacity="0.12" stroke="#c98500" stroke-width="1.5"/>
  <text x="647" y="394" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Job: apply</text>
  <text x="647" y="416" font-size="12" fill="#898781" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">tofu apply</text>

  <line x1="736" y1="405" x2="784" y2="405" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="788" y="360" width="136" height="90" rx="10" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-width="1.5"/>
  <text x="856" y="394" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Azure updated</text>
  <text x="856" y="416" font-size="12" fill="#c3c2b7" text-anchor="middle">new reality</text>

  <!-- bottom note -->
  <g transform="translate(52,568)">
    <circle r="8" fill="#0ca30c"/>
    <path d="M-3.5 0.5 L-1 3 L3.5 -2.5" fill="none" stroke="#1a1a19" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="68" y="572" font-size="12.5" fill="#c3c2b7">PR runs never apply and hold no apply rights — apply runs only from main, behind the environment gate.</text>
</svg>
