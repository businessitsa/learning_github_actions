<!-- static/img/diagrams/pipeline-overview.svg — Course diagram system v1
     canvas #1a1a19 · Azure #3987e5 · OpenTofu #c98500 · developer #199e70 · GitHub neutral
     ink #fff / #c3c2b7 / #898781 · palette CVD-validated (dataviz validator, dark surface) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pipelineTitle pipelineDesc">
  <title id="pipelineTitle">The target pipeline: from commit to cloud</title>
  <desc id="pipelineDesc">A developer pushes OpenTofu code to a GitHub repository. A GitHub Actions runner is triggered, exchanges an OIDC token with Microsoft Entra ID for a short-lived access token, then runs tofu plan and apply against an Azure subscription. No long-lived secrets are stored anywhere.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="519" rx="12" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="32" y="46" font-size="20" font-weight="600" fill="#ffffff">From commit to cloud: the target pipeline</text>
  <text x="32" y="70" font-size="13" fill="#898781">One push deploys real Azure infrastructure, authenticated with short-lived OIDC tokens instead of stored secrets</text>

  <!-- Developer -->
  <rect x="36" y="120" width="140" height="84" rx="10" fill="#199e70" fill-opacity="0.12" stroke="#199e70" stroke-width="1.5"/>
  <text x="106" y="152" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Developer</text>
  <text x="106" y="172" font-size="12" fill="#c3c2b7" text-anchor="middle">edits .tf files,</text>
  <text x="106" y="188" font-size="12" fill="#c3c2b7" text-anchor="middle">commits, pushes</text>

  <line x1="180" y1="162" x2="262" y2="162" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="223" y="150" font-size="12.5" fill="#c3c2b7" text-anchor="middle">1 · git push</text>

  <!-- GitHub repository -->
  <rect x="270" y="120" width="180" height="84" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="360" y="152" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">GitHub repository</text>
  <text x="360" y="176" font-size="12" fill="#c3c2b7" text-anchor="middle">workflows + OpenTofu code</text>

  <line x1="454" y1="162" x2="542" y2="162" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="150" font-size="12.5" fill="#c3c2b7" text-anchor="middle">2 · trigger</text>

  <!-- GitHub Actions runner -->
  <rect x="550" y="110" width="220" height="110" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="660" y="138" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">GitHub Actions runner</text>
  <text x="660" y="158" font-size="12" fill="#c3c2b7" text-anchor="middle">fresh ubuntu-latest VM</text>
  <rect x="585" y="172" width="150" height="30" rx="8" fill="#c98500" fill-opacity="0.13" stroke="#c98500" stroke-width="1.25"/>
  <circle cx="603" cy="187" r="4" fill="#c98500"/>
  <text x="613" y="191" font-size="12.5" fill="#ffffff">OpenTofu CLI</text>

  <!-- Microsoft Entra ID -->
  <rect x="270" y="300" width="220" height="84" rx="10" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-width="1.5"/>
  <text x="380" y="330" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Microsoft Entra ID</text>
  <text x="380" y="350" font-size="12" fill="#c3c2b7" text-anchor="middle">matches the token against</text>
  <text x="380" y="366" font-size="12" fill="#c3c2b7" text-anchor="middle">a federated credential</text>

  <!-- OIDC exchange arrows -->
  <line x1="595" y1="224" x2="445" y2="294" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="246" font-size="12.5" fill="#c3c2b7" text-anchor="end">3 · job's OIDC token (JWT)</text>
  <line x1="505" y1="300" x2="655" y2="228" stroke="#898781" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="585" y="288" font-size="12.5" fill="#c3c2b7" text-anchor="start">4 · short-lived access token</text>

  <!-- Azure subscription -->
  <rect x="796" y="200" width="140" height="250" rx="10" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-width="1.5"/>
  <text x="866" y="230" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Azure</text>
  <text x="866" y="248" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">subscription</text>
  <circle cx="818" cy="282" r="3.5" fill="#3987e5"/>
  <text x="830" y="286" font-size="12" fill="#c3c2b7">resource group</text>
  <circle cx="818" cy="312" r="3.5" fill="#3987e5"/>
  <text x="830" y="316" font-size="12" fill="#c3c2b7">virtual network</text>
  <circle cx="818" cy="342" r="3.5" fill="#3987e5"/>
  <text x="830" y="346" font-size="12" fill="#c3c2b7">storage account</text>
  <circle cx="818" cy="372" r="3.5" fill="#3987e5"/>
  <text x="830" y="376" font-size="12" fill="#c3c2b7">app resource</text>

  <path d="M770 165 H866 V196" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="778" y="153" font-size="12.5" fill="#c3c2b7">5 · tofu plan / apply</text>

  <!-- security note -->
  <g transform="translate(52,486)">
    <circle r="8" fill="#0ca30c"/>
    <path d="M-3.5 0.5 L-1 3 L3.5 -2.5" fill="none" stroke="#1a1a19" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="68" y="490" font-size="12.5" fill="#c3c2b7">No long-lived cloud secrets anywhere — tokens are minted per run and expire within minutes.</text>
</svg>
