# .github/workflows/tofu-plan.yml
name: Plan
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Initialise
        run: tofu init

      - name: Validate
        run: tofu validate

      - name: Lint with tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6.3.0

      - name: Run tflint
        run: |
          tflint --init
          tflint --format compact

      - name: Scan for misconfigurations with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Plan
        run: tofu plan -no-color -out=tfplan

      - name: Publish the plan to the run summary
        run: |
          {
            echo '## OpenTofu plan'
            echo '```'
            tofu show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
